- name: The body of every pull request is not empty
  run: |
    python3 - <<'PY'

    import json, os, sys
    pr = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["pull_request"]
    if not (pr.get("body") or "").strip():
        print("pull request body is empty")
        sys.exit(1)

    PY
