- name: Branch names match feat/, fix/, chore/ or docs/
  run: |
    python3 - <<'PY'

    import json, os, sys
    pr = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["pull_request"]
    ref = pr["head"]["ref"]
    if not ref.startswith(("feat/", "fix/", "chore/", "docs/")):
        print("branch %s does not match the convention" % ref)
        sys.exit(1)

    PY
