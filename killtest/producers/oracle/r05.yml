- name: No pull request is merged without at least one approved review
  run: |
    python3 - <<'PY'

    import json, os, sys
    pr = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["pull_request"]
    if not any(r.get("state") == "APPROVED" for r in pr.get("reviews", [])):
        print("no approved review")
        sys.exit(1)

    PY
