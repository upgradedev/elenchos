- name: A pull request with merge conflicts is not merged
  run: |
    python3 - <<'PY'

    import json, os, sys
    pr = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["pull_request"]
    if pr.get("mergeable") is False or pr.get("mergeable_state") == "dirty":
        print("pull request has merge conflicts")
        sys.exit(1)

    PY
