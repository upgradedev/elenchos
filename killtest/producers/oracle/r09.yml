- name: A pull request does not touch more than 50 files
  run: |
    python3 - <<'PY'

    import json, os, sys
    pr = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["pull_request"]
    if pr["changed_files"] > 50:
        print("%d changed files, limit is 50" % pr["changed_files"])
        sys.exit(1)

    PY
