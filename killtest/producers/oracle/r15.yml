- name: Every workflow declares timeout-minutes
  run: |
    python3 - <<'PY'

    import glob, re, sys
    bad = []
    for path in sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")):
        if not re.search(r"(?m)^\s*timeout-minutes:", open(path, encoding="utf-8").read()):
            bad.append(path)
    if bad:
        for p in bad:
            print("%s declares no timeout-minutes" % p)
        sys.exit(1)

    PY
