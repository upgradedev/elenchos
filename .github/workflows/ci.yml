name: CI

# Every action is pinned to a commit SHA, every job declares permissions and a timeout, and no
# step is allowed to carry continue-on-error. Rules 11, 12, 13 and 15 of our own rule pack are
# enforced here, on us, by scripts/gates.py. A tool that cannot pass its own audit is the finding.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Prove the gates can fail
        run: python scripts/gates.py --selftest

      - name: Run the gates
        run: python scripts/gates.py

      # Elenchos, run on Elenchos, on every pull request, without anyone asking for it. The finding
      # lands in this run's job summary, which is a page the team already opens, rather than on a
      # dashboard of ours that nobody would.
      - name: Elenchos
        uses: ./
        with:
          fail-on-finding: "false"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements/ci.txt

      - name: Unit and integration tests
        run: python -m pytest --cov=src/elenchos --cov-report=term-missing --cov-fail-under=85

  killtest:
    name: Kill test, scored from cached responses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements/ci.txt

      # The instrument is calibrated before it is allowed to report anything. If the hand written
      # oracle is not 20/20, no other number from this job means anything.
      # Not `| tail -1 | grep`. The harness prints the score and then prints where it wrote the
      # results, so the last line is a file path and the check could never match. It failed closed
      # rather than open, which is the only reason it was caught rather than trusted.
      - name: Calibrate the instrument
        run: |
          cd killtest
          python harness.py --producer oracle | tee /tmp/oracle.txt
          grep -q "oracle: 20/20" /tmp/oracle.txt

      - name: Re-score the recorded runs
        run: |
          cd killtest
          python harness.py --producer template | tail -1
          for n in 1 2 3; do
            ELENCHOS_RAW_DIR="$PWD/results/nemotron_b_raw_run$n" \
              python harness.py --producer nemotron_b --label "_run$n" | tail -1
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The SHA below was read from the GitHub API, not remembered. An earlier version of this
      # step pinned a docker image to a digest that was invented rather than looked up, and it
      # failed with "manifest unknown" the first time CI ever ran. A pin nobody resolved is a
      # supply chain claim nobody checked.
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
