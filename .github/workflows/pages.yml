name: Pages

# The judge URL. Router rule: before opening any infrastructure or evidence pull request, curl the
# judge URL, and while it returns anything but 200 that is the whole task. This workflow is what
# makes that URL exist, so it ships before the engine is finished, not after.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the demo surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record the commit the surface serves
        run: |
          echo "$GITHUB_SHA" > web/DEPLOYED_SHA
          echo "Serving $GITHUB_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the surface
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # A deploy step that reports success without the page serving is the same defect this
      # project exists to expose. So the workflow fetches what it just published and fails on
      # anything but a 200 carrying the page's own text.
      - name: Prove the published page actually serves
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "probing $url"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o body.html -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ] && grep -q "claim" body.html; then
              echo "200 with the expected body on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: status $code"
            sleep 10
          done
          echo "the published page did not serve 200 with the expected body"
          exit 1
